name: Compilar e Publicar BusRadar APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'static/**'
      - 'build_apk.py'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK (API 34 + Build Tools 34.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências Python
        run: python -m pip install --upgrade pip pillow

      - name: Restaurar release.keystore (Secret)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "Keystore permanente restaurada com sucesso!"
          else
            echo "::warning::Secret RELEASE_KEYSTORE_BASE64 não configurado! Uma keystore temporária será gerada."
          fi

      - name: Compilar BusRadar.apk
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: python build_apk.py

      - name: Ler versão gerada
        id: meta
        run: |
          python -c "import json; d=json.load(open('version.json')); print(f'version_name={d[\"versionName\"]}'); print(f'version_code={d[\"versionCode\"]}')" >> $GITHUB_OUTPUT

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: BusRadar v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          body: |
            Compilação automática do BusRadar v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }}).
          files: |
            BusRadar.apk
            version.json
          make_latest: true
